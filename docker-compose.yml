services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - TORCHINDUCTOR_CACHE_DIR=/tmp/torchinductor
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - YOLO_MODEL_PATH=/app/.cache/ultralytics/yolov8n.pt
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5176:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
